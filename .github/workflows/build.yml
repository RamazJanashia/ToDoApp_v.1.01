name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run TodoCore checks
        run: ./build.sh --check

      - name: Build the app bundle
        run: ./build.sh

      - name: Build with Swift Package Manager
        run: swift build -c release
